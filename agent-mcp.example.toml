[server]
name = "agent-mcp"
transport = "stdio"
# audit_log = "audit.jsonl"

# A module is loaded only if it has a section here.
# `tools` is required. List each tool to expose, or ["*"] for all.
[modules.example]
tools = ["greet"]

[modules.example.settings]
greeting = "hei"

# Everything here can also be set in .env (see .env.example), which wins over this file.
# The calendar module is configured there, including its Google credentials.
